- title: "DiffAuction: An Auction-Driven Framework for Generative Image Advertising"
  short: DiffAuction
  year: 2026
  venue: Preprint
  selected: true
  image: publication_preview/diffauction.png
  summary: >-
    Lets multiple advertisers compete for exposure inside one generated image: a training-free method controls how
    prominently each product appears, and a learnable truthful auction sets prices, earning
    up to 51% more revenue than a Myerson-based baseline.
