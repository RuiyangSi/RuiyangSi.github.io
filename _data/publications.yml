- title: "Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success but 65% Fewer Tokens"
  short: PyRUA-Lean
  year: 2026
  venue: Technical Report
  selected: true
  image: publication_preview/pyrua-lean.svg
  summary: >-
    An efficient code-execution framework for robot-use agents: the agent chains robot primitives in Python cells,
    raising success from 63.1% to 71.7% with 65% fewer input tokens. Achieves <strong>state-of-the-art on RoboDojo</strong>
    (51.6% success, 19.4 points above the previous best on the public leaderboard), and our GRPO-trained 4B Coder
    generalizes to unseen tasks (18.8% → 44.1%), outperforming Qwen3.5-27B.
