- title: "Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement"
  short: RSIJudge
  series: PyRUA-Lean
  year: 2026
  venue: Preprint
  selected: false
  image: publication_preview/rsijudge.png
  image_full: publication_preview/rsijudge-full.png
  summary: >-
    Letting a self-improving robot coding agent read the benchmark's success criteria helps only on that verifier:
    on criteria-limited tasks, its 23.8-point lead vanishes once the same episodes are judged by
    instruction-faithful criteria.
