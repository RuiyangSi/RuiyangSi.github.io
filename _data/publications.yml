- title: "Object-AVEdit: An Object-level Audio-Visual Editing Model"
  short: Object-AVEdit
  year: 2025
  venue: Preprint
  selected: false
  image: publication_preview/avedit.png
  summary: >-
    We train an audio generation model whose text tokens are explicitly aligned with sounding objects, and build on it
    the first model for object-level audio-visual editing, supporting object addition, replacement and removal
    across both audio and video.
