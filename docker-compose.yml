# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.14.6
    # build: .  # 注释掉，只使用预构建镜像，避免本地构建
    # 上面这两行可以同时存在，表示用当前目录 build，然后 tag 成这个 image 名
    # 如果你只想用 Docker Hub 的预构建镜像，可以把 build: . 删掉

    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - jekyll_bundle:/usr/local/bundle # 这里引用命名卷
    environment:
      - JEKYLL_ENV=development
    command: >
      bash -c "cd /srv/jekyll &&
      git config --global --add safe.directory '*' &&
      if git ls-files --error-unmatch Gemfile.lock &> /dev/null; then
        echo 'Gemfile.lock is tracked, restoring it' &&
        git restore Gemfile.lock 2>/dev/null || true;
      fi &&
      echo 'Installing gems...' &&
      bundle install &&
      echo 'Starting Jekyll...' &&
      bundle exec jekyll serve --watch --port=8080 --host=0.0.0.0 --livereload --verbose --trace --force_polling"

volumes:
  jekyll_bundle: # 这里定义命名卷（和 services 同级）
